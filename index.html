  if(kind=="song"){it.title=v("f1")||it.title;it.artist=v("f2")||it.artist;it.album=v("f3")||"Singles";it.cover=M.cov}
  else if(kind=="playlist"){const p=it||{id:uid++,ids:[]};p.name=v("f1")||"New Playlist";p.ids=[...sel];p.cover=M.cov;if(!it)P.push(p)}
  else{const n=v("f1")||"New Album";S.forEach(s=>{if(sel.has(s.id))s.album=n;else if(key&&s.album==key)s.album="Singles"});if(key&&key!=n)delete AM[key];AM[n]={cover:M.cov};const l=nav.at(-1);if(l[0]=="album")l[1]=n}
  closeM();persist();render()}};
/* ---------- player ---------- */
const au=new Audio();au.volume=.8;
const cur=()=>S.find(s=>s.id==Q[qi]);
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function play(id,list){Q=list.slice();qi=Q.indexOf(id);load()}
function load(){const s=cur();if(!s)return;au.src=s.url;au.play().catch(()=>{});upd()}
function step(d,auto){if(!Q.length)return;if(auto&&rep==2){au.currentTime=0;au.play();return}let k=qi+d;if(shuf&&d>0&&Q.length>1){do k=Math.floor(Math.random()*Q.length);while(k==qi)}if(k>=Q.length){if(auto&&!rep){au.pause();return}k=0}if(k<0)k=Q.length-1;qi=k;load()}
function ic(){const p=!au.paused;$("#mp").innerHTML=$("#pp").innerHTML=p?PA:PL;$("#np").classList.toggle("paused",!p);const b=$("#pp");b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop")}
function upd(){const s=cur();$("#mini").classList.toggle("hide",!s);if(!s){bg();return}const c=cv(s.cover,s.title);
 $("#mart").innerHTML=c;$("#nart").innerHTML=c;$("#mt").textContent=$("#nt").textContent=s.title;$("#nsub").textContent=s.artist;$("#fav").textContent=s.fav?"♥":"♡";$("#fav").classList.toggle("on",!!s.fav);bg();ic()}
$("#mini").onclick=e=>{if(e.target.closest("#mp")){tog();return}if(e.target.closest("#mn")){step(1);return}$("#np").classList.add("open")};
$("#close").onclick=()=>$("#np").classList.remove("open");
const tog=()=>{if(cur())au.paused?au.play():au.pause()};
$("#pp").onclick=tog;$("#next").onclick=()=>step(1);$("#prev").onclick=()=>{if(au.currentTime>3)au.currentTime=0;else step(-1)};
$("#nart").onclick=()=>{const s=cur();if(s)pickImg(c=>{s.cover=c;persist();upd();render()})};
au.onplay=au.onpause=ic;au.onended=()=>step(1,true);
au.onerror=()=>{const s=cur();if(s)$("#nsub").textContent="This format isn't supported on this device"};
let drag=false,spdI=0,slT=null,slI=0;const SPD=[1,1.25,1.5,2,.75],SLP=[0,15,30,60];
const sk=$("#sk");
function seekTo(x){const r=sk.getBoundingClientRect(),p=Math.min(1,Math.max(0,(x-r.left)/r.width));$("#skf").style.width=p*100+"%";if(au.duration){$("#cur").textContent=fmt(p*au.duration);$("#dur").textContent="-"+fmt((1-p)*au.duration)}return p}
sk.onpointerdown=e=>{drag=true;sk.classList.add("dr");sk.setPointerCapture(e.pointerId);seekTo(e.clientX)};
sk.onpointermove=e=>{if(drag)seekTo(e.clientX)};
sk.onpointerup=sk.onpointercancel=e=>{if(!drag)return;drag=false;sk.classList.remove("dr");const p=seekTo(e.clientX);if(au.duration)au.currentTime=p*au.duration};
au.ontimeupdate=()=>{if(!au.duration||drag)return;$("#skf").style.width=au.currentTime/au.duration*100+"%";$("#cur").textContent=fmt(au.currentTime);$("#dur").textContent="-"+fmt(au.duration-au.currentTime)};
$("#fav").onclick=()=>{const s=cur();if(s){s.fav=!s.fav;persist();upd()}};
$("#shuf2").onclick=e=>{shuf=!shuf;e.currentTarget.classList.toggle("on",shuf)};
$("#rep").onclick=e=>{rep=(rep+1)%3;e.currentTarget.classList.toggle("on",rep>0);e.currentTarget.dataset.r=rep};
$("#spd").onclick=e=>{spdI=(spdI+1)%SPD.length;au.defaultPlaybackRate=au.playbackRate=SPD[spdI];e.currentTarget.querySelector("b").textContent=SPD[spdI]+"×"};
$("#qbtn").onclick=queue;
$("#ed").onclick=()=>{const s=cur();if(s)modal("song",s.id)};
$("#sl").onclick=e=>{slI=(slI+1)%SLP.length;clearTimeout(slT);const m=SLP[slI];if(m)slT=setTimeout(()=>au.pause(),m*6e4);e.currentTarget.querySelector("b").textContent=m?m+"m":"☾"};
document.addEventListener("input",e=>{if(e.target.id=="gs"){set.g=+e.target.value;e.target.style.setProperty("--p",set.g+"%");$("#gv").textContent=set.g+"%";R.setProperty("--g",set.g/100)}});
document.addEventListener("change",e=>{if(e.target.id=="gs")sv()});
(async()=>{const m=await idbGet("meta");if(m){uid=m.uid||1;P=m.P||[];AM=m.AM||{};for(const x of m.S||[]){const b=await idbGet("b"+x.id);if(b)S.push({...x,blob:b,url:URL.createObjectURL(b)})}}applyTheme();ic();render();if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})})();
</script></body></html>
